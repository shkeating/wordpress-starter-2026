services:
  workspace:
    image: mcr.microsoft.com/devcontainers/php:1-8.3-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      # Use the forwarded Codespaces host/protocol instead of localhost:8080. "$$" escapes compose interpolation.
      WORDPRESS_CONFIG_EXTRA: |
        if (!empty($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
          $$_SERVER['HTTP_HOST'] = $$_SERVER['HTTP_X_FORWARDED_HOST'];
          $$_SERVER['HTTPS'] = 'on';
          define('WP_HOME', 'https://' . $$_SERVER['HTTP_HOST']);
          define('WP_SITEURL', 'https://' . $$_SERVER['HTTP_HOST']);
        }
    volumes:
      - wordpress-data:/var/www/html
      - ../:/var/www/html/wp-content/themes/mid-hudson-misfits:cached

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wordpress-data:
  mariadb-data:
